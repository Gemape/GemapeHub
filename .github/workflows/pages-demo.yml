name: Publicar demonstração no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build em modo demonstração no subpath do Pages
        run: GITHUB_PAGES=true VITE_DEMO_MODE=true npm run build -- --mode demo
      - name: Gerar entrada estática e fallback das rotas
        shell: bash
        run: |
          set -euo pipefail
          VITE_DEMO_MODE=true PORT=4174 HOST=127.0.0.1 node .output/server/index.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 12 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:4174/GemapeHub/ -o .output/public/index.html
          grep -aq '/GemapeHub/assets/' .output/public/index.html
          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
      - id: deployment
        uses: actions/deploy-pages@v4
